name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate skill format
        run: python3 scripts/lint_skills.py
      - name: Validate the registry parses
        run: python3 -c "import json; json.load(open('sources.json'))"
