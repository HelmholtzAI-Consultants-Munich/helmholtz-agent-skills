name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml openpyxl
      - name: Test dataset scouting helpers
        run: python3 -B -m unittest discover -s scripts -p 'test_dataset_scouting.py'
      - name: Validate skill format
        run: python3 scripts/lint_skills.py
      - name: Validate the registry parses
        run: python3 -c "import json; json.load(open('sources.json'))"
      - name: Validate the marketplace layout
        run: python3 scripts/verify_marketplace.py
