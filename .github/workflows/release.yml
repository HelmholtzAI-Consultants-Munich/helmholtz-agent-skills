name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      # Fetches every public source fresh. Embargoed and gated sources are skipped:
      # CI has no credentials for them, and their content must never reach a public
      # release. Build those by hand from their own repository.
      - name: Build Claude Science archives
        run: python3 scripts/build_zips.py

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: dist/RELEASE_NOTES.md

      - name: Upload archives as artifacts
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: skill-archives
          path: dist/
